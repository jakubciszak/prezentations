name: "In-Store Purchase"
version: 1
client_type: purchase_in_store
description: "Loyalty activity flow for in-store purchase transactions"

# Activity (Case) = processing a purchase through the loyalty program
# Stages (Communications) = phases of loyalty activity processing
# Steps (Activities) = individual actions within each phase
# Each step outcome maps to the next step to execute

stages:
  - id: transaction_validation
    name: "Transaction Validation"
    steps:
      - id: validate_transaction
        name: "Validate Transaction"
        service: transaction
        action: validate
        participants:
          - role: customer
          - role: store
        required_metadata:
          - transaction_id
          - amount
          - currency
          - store_id
        outcomes:
          valid:
            next_step: calculate_points
          invalid:
            terminal: true
            case_outcome: rejected
          fraud_suspected:
            next_step: manual_transaction_review

      - id: manual_transaction_review
        name: "Manual Transaction Review"
        service: transaction
        action: manual_review
        participants:
          - role: fraud_analyst
        outcomes:
          approved:
            next_step: calculate_points
          rejected:
            terminal: true
            case_outcome: rejected

  - id: points_processing
    name: "Points Processing"
    steps:
      - id: calculate_points
        name: "Calculate Points"
        service: points
        action: calculate
        outcomes:
          points_calculated:
            next_step: evaluate_tier
          zero_points:
            terminal: true
            case_outcome: completed_no_points
          bonus_applied:
            next_step: evaluate_tier

  - id: tier_evaluation
    name: "Tier Evaluation"
    steps:
      - id: evaluate_tier
        name: "Evaluate Tier Status"
        service: tier
        action: evaluate
        outcomes:
          tier_unchanged:
            next_step: assign_reward
          tier_upgrade:
            next_step: process_tier_upgrade

      - id: process_tier_upgrade
        name: "Process Tier Upgrade"
        service: tier
        action: upgrade
        outcomes:
          upgraded:
            next_step: assign_reward

  - id: reward_fulfillment
    name: "Reward Fulfillment"
    steps:
      - id: assign_reward
        name: "Assign Reward"
        service: reward
        action: assign
        outcomes:
          reward_assigned:
            terminal: true
            case_outcome: points_awarded
          no_reward_available:
            terminal: true
            case_outcome: points_awarded
