services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # === MembershipActivity context ===

    App\MembershipActivity\Application\Flow\FlowRegistry:
        factory: ['App\MembershipActivity\Application\Flow\MembershipFlows', 'standard']

    App\MembershipActivity\Domain\MemberAccountRepository:
        class: App\MembershipActivity\Infrastructure\InMemoryMemberAccountRepository

    App\MembershipActivity\Application\ServiceRouter:
        arguments:
            $services:
                points_calculation: '@App\Points\Application\PointsCalculationService'
                points_activation: '@App\Points\Application\PointsActivationService'
                reward_service: '@App\Rewards\Application\RewardRedemptionService'

    App\MembershipActivity\Handler\EventLogger: ~

    # === Points context ===

    App\Points\Application\PointsCalculationService: ~
    App\Points\Application\PointsActivationService: ~

    # === Rewards context ===

    App\Rewards\Domain\RewardCatalog:
        class: App\Rewards\Infrastructure\InMemoryRewardCatalog

    App\Rewards\Application\RewardRedemptionService: ~
