services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # --- Flow Configuration ---
    App\Membership\Model\Flow\FlowRegistry:
        factory: ['App\Membership\Model\Flow\MembershipFlows', 'standard']

    # --- Services ---
    App\Membership\Service\PointsCalculationService: ~
    App\Membership\Service\PointsActivationService: ~
    App\Membership\Service\RewardService: ~
    App\Membership\Service\ServiceRouter:
        arguments:
            $services:
                points_calculation: '@App\Membership\Service\PointsCalculationService'
                points_activation: '@App\Membership\Service\PointsActivationService'
                reward_service: '@App\Membership\Service\RewardService'

    # --- Repositories ---
    App\Membership\Model\MemberAccountRepository:
        class: App\Infrastructure\InMemoryMemberAccountRepository

    App\Membership\Model\Reward\RewardCatalog:
        class: App\Infrastructure\InMemoryRewardCatalog

    # --- Event Handlers ---
    App\Membership\Handler\EventLogger: ~
